<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Salary management for HR: employees, pay history, pay bands, and compensation analytics."
    />
    <title>Salary Management</title>
    <!-- Applies the saved or system colour scheme before React loads, so dark mode does not flash white. -->
    <script>
      try {
        var saved = localStorage.getItem("mantine-color-scheme-value") || "auto";
        var dark =
          saved === "dark" ||
          (saved === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-mantine-color-scheme", dark ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
